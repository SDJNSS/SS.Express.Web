schemaVersion: '0.1'
page:
  id: iam-permission-package-management
  name: 权限包管理
  feature: iam/permission-governance
  type: ListPage
  patternKey: ListPageTemplate
  revision: 4
sources:
  inputMode: prd-only
  prd:
    - id: permission-v2-prd
      ref: docs/prd/iam/permission-scheme-v2.md
      section: 权限包管理
      purpose: 定义 iam_permission_package 列表、字段、新增编辑和权限配置入口
  api:
    - id: permission-package-api
      ref: src/features/iam/permission-governance/api/permissionGovernanceApi.ts
      section: endpoints
      operation: POST /iam-admin/AuthorizationCatalog/QuerySystems; POST /iam-admin/PermissionPackage/Query; POST /iam-admin/PermissionPackage/Get; POST /iam-admin/PermissionPackage/Create; POST /iam-admin/PermissionPackage/Update
      purpose: 绑定权限包列表、详情、创建与乐观并发更新的正式端点和 DTO
  permissions:
    - id: permission-package-permission
      ref: src/shared/constants/iamPermissions.ts
      section: IAM_PERMISSION_GOVERNANCE_RESOURCES.permissionPackages
      operation: IAM.PERMISSION_PACKAGES; IAM.PERMISSION_PACKAGES.CREATE; IAM.PERMISSION_PACKAGES.UPDATE; IAM.PERMISSION_PACKAGES.PERMISSIONS
      purpose: 分别控制权限包路由、新增、编辑和进入权限配置的稳定前端资源
  ux:
    - id: dataset-ux
      ref: UX-CONTRACT.md
      section: Dataset navigation
      purpose: 约束查询、列表、分页和行操作
    - id: async-ux
      ref: UX-CONTRACT.md
      section: Async and resilience
      purpose: 约束新增编辑提交、失败保留和重试
  references:
    - id: permission-management-sibling
      ref: docs/page-specs/iam-permission-scheme-management.yaml
      origin: project
      kind: document
      purpose: 与权限管理保持同一治理列表密度和操作语言
implementation:
  canonicalEntry: src/features/iam/permission-governance/components/PermissionPackageManagementPageView.vue
  previewEntry: src/features/iam/permission-governance/public.preview.ts
  previewBinding: src/features/iam/permission-governance/preview/PermissionGovernancePreviewPage.vue
  productionBinding: src/features/iam/permission-governance/pages/PermissionPackageManagementPage.vue
  productionRoute: /iam/permission-packages
  routeSource: src/features/iam/routes.ts
composition:
  layoutKey: AppLayout
  regions:
    - { id: header, role: header, order: 1 }
    - { id: filters, role: search, order: 2 }
    - { id: results, role: data, order: 3 }
    - { id: detail, role: detail, order: 4 }
    - { id: forms, role: form, order: 5 }
    - { id: feedback, role: feedback, order: 6 }
  components:
    - { id: app-page, componentKey: shared.app-page, regionId: header, purpose: 使用统一内容区边界 }
    - {
        id: page-header,
        componentKey: shared.page-header,
        regionId: header,
        purpose: 承载页面标题和新增权限包入口,
      }
    - {
        id: search-panel,
        componentKey: shared.search-panel,
        regionId: filters,
        purpose: 按权限包名称或编码和 App 查询,
      }
    - {
        id: package-table,
        componentKey: shared.data-table,
        regionId: results,
        purpose: 展示包编码、名称、所属 App、Permission 数量、说明、排序和版本,
      }
    - {
        id: package-detail,
        componentKey: shared.detail-drawer,
        regionId: detail,
        purpose: 展示权限包字段和 Permission 摘要,
      }
    - {
        id: package-form,
        componentKey: shared.form-drawer,
        regionId: forms,
        purpose: 新增或编辑 App、名称、说明与排序，编码只读,
      }
states:
  - id: ready
    isDefault: true
    scopeRef: page
    observableResult: 展示权限包列表、所属 App、Permission 数量和核心字段
    ruleRef: permission-v2-prd
  - id: loading
    scopeRef: results
    observableResult: 权限包加载期间保持列表结构且不显示陈旧结果
    ruleRef: async-ux
  - id: empty
    scopeRef: results
    observableResult: 无权限包时提供新增权限包入口
    ruleRef: permission-v2-prd
  - id: filter-empty
    scopeRef: results
    observableResult: 无匹配权限包时保留筛选条件并提供清空入口
    ruleRef: dataset-ux
  - id: creating
    scopeRef: forms
    observableResult: 新增抽屉要求选择 App、填写名称、说明与排序，编码由系统生成
    ruleRef: permission-v2-prd
  - id: retryable-error
    scopeRef: feedback
    observableResult: 查询或提交失败时保留上下文和表单输入并提供重试
    ruleRef: async-ux
interactions:
  - id: filter-packages
    trigger: 提交或重置权限包筛选条件
    targetRef: results
    observableResult: 按名称或编码和 App 刷新列表并重置分页
    ruleRef: dataset-ux
  - id: create-package
    trigger: 点击新增权限包
    targetRef: forms
    observableResult: 打开创建抽屉，选择 App 并填写名称、说明与排序；编码为系统生成的只读值
    ruleRef: permission-v2-prd
  - id: edit-package
    trigger: 点击编辑
    targetRef: forms
    observableResult: 保留 package_code 只读，编辑名称、说明和排序并显示版本上下文
    ruleRef: async-ux
  - id: configure-package-permissions
    trigger: 点击权限配置
    targetRef: results
    observableResult: 进入该权限包的 Permission 树 Candidate，持续显示权限包上下文但不显示独立所属 App 区域或 App 名称
    ruleRef: permission-v2-prd
mockScenarios:
  - id: ready-default
    isDefault: true
    fixtureRef: src/features/iam/permission-governance/preview/permissionGovernance.fixture.ts
    stateRef: ready
    acceptanceRefs: [package-fields-complete, package-code-readonly, preview-isolated]
  - id: empty-state
    fixtureRef: src/features/iam/permission-governance/preview/permissionGovernance.fixture.ts
    stateRef: empty
    acceptanceRefs: [package-create-available]
exceptions: []
issues:
  blockers: []
  deferred:
    - id: production-deployment-deferred
      description: 正式 API、服务端编码规则、字符串 VersionToken、稳定前端资源码与 Production Binding 已闭合；生产环境部署和真实身份端到端联调由发布流程继续跟踪
      affectedScopes: [production-regression]
      owner: Web 与 IAM 发布
      resolutionTarget: 发布窗口完成生产部署和真实环境回归
  outOfScope:
    - id: no-role-assignment
      description: 本页维护权限包基本信息，不在列表中直接分配角色
      affectedScopes: [preview-visual, preview-interaction, production-binding]
    - id: no-data-scope
      description: 本次不新增业务数据范围配置
      affectedScopes: [preview-visual, preview-interaction, production-binding]
acceptance:
  - {
      id: compact-row-actions,
      sourceRef: dataset-ux,
      observableResult: 对象名称作为已有详情入口，不重复展示详情按钮；操作列按可见按钮自动测量，最多三列且紧凑行距,
      affectedScopes: [preview-visual, preview-interaction, production-regression],
      testRef: tests/visual/compact-row-actions.spec.ts,
    }
  - id: package-fields-complete
    sourceRef: permission-v2-prd
    observableResult: 列表与详情覆盖 package_code、package_name、description、sort_order、app_id，并展示 Permission 数量和版本
    affectedScopes: [preview-visual, preview-interaction]
    stateRef: ready
    testRef: tests/visual/iam-permission-governance-previews.spec.ts
  - id: package-code-readonly
    sourceRef: permission-v2-prd
    observableResult: 新增和编辑均不要求用户编写 package_code，编码由系统生成并只读展示
    affectedScopes: [preview-visual, preview-interaction]
    interactionRef: create-package
    testRef: tests/visual/iam-permission-governance-previews.spec.ts
  - id: package-create-available
    sourceRef: permission-v2-prd
    observableResult: 空列表和页面操作区均提供新增权限包入口
    affectedScopes: [preview-visual, preview-interaction]
    stateRef: empty
    testRef: tests/visual/iam-permission-governance-previews.spec.ts
  - id: preview-isolated
    sourceRef: async-ux
    observableResult: Candidate Preview 只使用确定性 Fixture，不访问 API、认证 Store 或生产路由
    affectedScopes: [preview-interaction]
    testRef: tests/visual/iam-permission-governance-previews.spec.ts
  - id: production-package-api-bound
    sourceRef: permission-package-api
    observableResult: 正式路由使用 Query/Get 加载权限包，Create 不提交前端生成的 package_code，Update 保留字符串 VersionToken 且冲突时不清空表单
    affectedScopes: [production-binding, production-regression]
    stateRef: ready
    testRef: tests/visual/iam-permission-governance-production.spec.ts
verification:
  viewports: [desktop-1366, desktop-1440, desktop-1920]
  browserTests:
    [
      tests/visual/iam-permission-governance-previews.spec.ts,
      tests/visual/iam-permission-governance-production.spec.ts,
    ]
