schemaVersion: '0.1'
page:
  id: iam-password-recovery
  name: 忘记密码页
  feature: iam/password-recovery
  type: AuthPage
  patternKey: AuthPageTemplate
  revision: 1
sources:
  inputMode: prd-with-reference
  prd:
    - id: password-recovery-brief
      ref: docs/prd/iam/password-recovery.md
      section: 候选范围
      purpose: 记录用户当前确认的页面目标、参考边界与候选验收要求
  api: []
  permissions: []
  ux:
    - id: auth-ux
      ref: UX-CONTRACT.md
      section: Authentication
      purpose: 约束密码找回反馈、状态与生产接入边界
    - id: validation-ux
      ref: UX-CONTRACT.md
      section: Validation
      purpose: 约束字段错误、首错聚焦和重复提交防护
  references:
    - id: user-password-recovery-reference
      ref: docs/design/references/iam-password-recovery.png
      origin: user
      kind: image
      purpose: 仅用于顶部品牌、居中单列找回表单和深色桌面构图参考
    - id: approved-login-sibling
      ref: UIDesign/baselines/iam-login/desktop-1440.png
      origin: project
      kind: approved-page
      purpose: 复用已确认认证场景的品牌、颜色、控件和排版关系
implementation:
  canonicalEntry: src/features/iam/password-recovery/components/PasswordRecoveryPageView.vue
  previewEntry: src/features/iam/password-recovery/public.preview.ts
  previewBinding: src/features/iam/password-recovery/preview/PasswordRecoveryPreviewPage.vue
composition:
  layoutKey: StandaloneAuthLayout
  regions:
    - { id: brand, role: header, order: 1 }
    - { id: recovery-form, role: form, order: 2 }
    - { id: form-feedback, role: feedback, order: 3 }
    - { id: return-entry, role: navigation, order: 4 }
  components:
    - id: auth-layout
      componentKey: shared.auth-page-template
      regionId: brand
      purpose: 提供独立于登录后 AppShell 的统一认证页面边界
    - id: auth-brand
      componentKey: shared.auth-brand
      regionId: brand
      purpose: 与已批准登录页共享陆链认证品牌结构
    - id: recovery-form-component
      componentKey: feature.iam.password-recovery.form
      regionId: recovery-form
      purpose: 展示账号字段与候选验证码动作
    - id: recovery-feedback
      componentKey: feature.iam.password-recovery.feedback
      regionId: form-feedback
      purpose: 展示字段错误、提交状态与不泄露账号存在性的通用反馈
states:
  - id: ready
    isDefault: true
    scopeRef: page
    observableResult: 品牌、找回说明、账号表单和返回入口完整可见
    ruleRef: password-recovery-brief
  - id: validation-error
    scopeRef: recovery-form
    observableResult: 空提交后账号错误可见并聚焦账号字段
    ruleRef: validation-ux
  - id: submitting
    scopeRef: recovery-form
    observableResult: 发送按钮保持几何、显示忙碌状态并阻止重复提交
    ruleRef: auth-ux
  - id: submitted
    scopeRef: form-feedback
    observableResult: 展示不确认账号存在性的通用已受理反馈
    ruleRef: auth-ux
  - id: retryable-error
    scopeRef: form-feedback
    observableResult: 展示可重试错误并保留账号输入
    ruleRef: auth-ux
interactions:
  - id: validate-recovery-account
    trigger: 未填写账号时点击发送验证码
    targetRef: recovery-form
    observableResult: 显示字段文本错误并聚焦账号输入框
    ruleRef: validation-ux
  - id: submit-preview-recovery
    trigger: 填写账号后点击发送验证码
    targetRef: form-feedback
    observableResult: 本地显示稳定提交态和通用完成反馈，不产生网络请求或路由跳转
    ruleRef: password-recovery-brief
  - id: return-to-login-preview
    trigger: 点击返回登录
    targetRef: return-entry
    observableResult: 本地显示候选入口反馈，不推断正式路由
    ruleRef: password-recovery-brief
mockScenarios:
  - id: ready-default
    isDefault: true
    fixtureRef: src/features/iam/password-recovery/preview/passwordRecovery.fixture.ts
    stateRef: ready
    acceptanceRefs: [recovery-composition-visible, preview-isolated]
  - id: submitting-state
    fixtureRef: src/features/iam/password-recovery/preview/passwordRecovery.fixture.ts
    stateRef: submitting
    acceptanceRefs: [recovery-interactions-work]
  - id: submitted-state
    fixtureRef: src/features/iam/password-recovery/preview/passwordRecovery.fixture.ts
    stateRef: submitted
    acceptanceRefs: [account-enumeration-protected]
  - id: retryable-error-state
    fixtureRef: src/features/iam/password-recovery/preview/passwordRecovery.fixture.ts
    stateRef: retryable-error
    acceptanceRefs: [recovery-interactions-work]
exceptions:
  - id: standalone-auth-surface
    standardRef: standards/README.md#App-Shell-内容区约束
    scopeRef: page
    reason: 密码找回发生在认证前，使用 Registry 登记的 StandaloneAuthLayout 与 AuthPageTemplate，不进入登录后的 AppShell 内容区
issues:
  blockers:
    - id: recovery-contract-unresolved
      description: 找回 API、验证码通道、有效期、错误码、限流与账号锁定策略尚无权威来源
      affectedScopes: [production-binding, production-regression]
      owner: IAM 与后端负责人
      resolutionTarget: 生产开发前提供找回 PRD、API 和安全策略并更新 Contract revision
    - id: recovery-route-unresolved
      description: 返回登录及后续验证步骤的生产路由尚未定义
      affectedScopes: [production-binding, production-regression]
      owner: 产品与 IAM 负责人
      resolutionTarget: 生产开发前提供路由与流程定义
  deferred: []
  outOfScope:
    - id: no-mobile-or-dark-theme-variant
      description: 当前只验证三个标准桌面视口；深色认证表面仍属于项目 Light Theme 的固定页面表达
      affectedScopes: [preview-visual, production-regression]
acceptance:
  - id: recovery-composition-visible
    sourceRef: password-recovery-brief
    observableResult: 顶部品牌、居中单列找回表单与返回入口在三个标准视口完整可见
    affectedScopes: [preview-visual]
    stateRef: ready
    testRef: tests/visual/iam-password-recovery.spec.ts
  - id: recovery-interactions-work
    sourceRef: password-recovery-brief
    observableResult: 字段校验、返回入口、提交态、已受理态和可重试错误均有可观察结果
    affectedScopes: [preview-interaction]
    testRef: tests/visual/iam-password-recovery.spec.ts
  - id: account-enumeration-protected
    sourceRef: auth-ux
    observableResult: 找回完成反馈不确认账号是否存在
    affectedScopes: [preview-visual, preview-interaction]
    stateRef: submitted
    testRef: tests/visual/iam-password-recovery.spec.ts
  - id: preview-isolated
    sourceRef: password-recovery-brief
    observableResult: Preview 使用静态 Fixture，不接真实 API、认证、Store 或路由
    affectedScopes: [preview-interaction]
    testRef: tests/visual/iam-password-recovery.spec.ts
verification:
  viewports: [desktop-1366, desktop-1440, desktop-1920]
  browserTests: [tests/visual/iam-password-recovery.spec.ts]
