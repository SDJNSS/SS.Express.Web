schemaVersion: '0.1'
page:
  id: training-course-management
  name: 课程管理
  feature: training/content-exam
  type: ListPage
  patternKey: ListPageTemplate
  revision: 8
sources:
  inputMode: prd-only
  prd:
    - {
        id: training-prd,
        ref: docs/prd/training/training-resources-exam-rules.md,
        section: M02 课程管理,
        purpose: 定义课程查询、详情、创建编辑、复制、上传与状态流转,
      }
  api:
    - {
        id: course-video-api,
        ref: docs/api/dms-files.md,
        section: 同步视频标准化（2026-10-23）,
        operation: 'POST /dms/File/Upload|ValidateVideo|GetAccessUrl',
        purpose: 等待同步标准化和校验后使用稳定文件引用，详情及课程新建编辑中自动展示临时封面及播放地址并按租约续签,
      }
    - {
        id: training-content-api,
        ref: docs/api/training-content-exam-api.md,
        section: 写操作模型,
        operation: 'POST /iam-admin/TrainingCourse/Query|Detail|Create|Update|ChangeStatus|Copy',
        purpose: 定义正式页面查询与写操作模型,
      }
  permissions:
    - {
        id: training-content-permissions,
        ref: docs/api/training-content-exam-api.md,
        section: 待登记的权限点,
        purpose: 声明前端功能权限与后端独立登记边界,
      }
    - {
        id: iam-runtime-permission,
        ref: docs/api/iam-shell-context.md,
        section: 页面与按钮权限,
        purpose: 定义正式运行时功能权限发现机制,
      }
  ux:
    - {
        id: list-ux,
        ref: UX-CONTRACT.md,
        section: List and CRUD behavior,
        purpose: 约束分页、抽屉、状态确认与失败恢复,
      }
  references:
    - {
        id: project-design,
        ref: DESIGN.md,
        origin: project,
        kind: document,
        purpose: 复用物流平台高密度管理端视觉语言,
      }
implementation:
  canonicalEntry: src/features/training/content-exam/components/CourseManagementPageView.vue
  previewEntry: src/features/training/content-exam/public.preview.ts
  previewBinding: src/features/training/content-exam/preview/TrainingContentPreviewPage.vue
  productionBinding: src/features/training/content-exam/pages/CourseManagementPage.vue
  productionRoute: /iam/training/courses
  routeSource: src/features/training/routes.ts
composition:
  layoutKey: AppLayout
  regions:
    - { id: header, role: header, order: 1 }
    - { id: search, role: search, order: 2 }
    - { id: data, role: data, order: 3 }
    - { id: detail, role: detail, order: 4 }
    - { id: form, role: form, order: 5 }
    - { id: feedback, role: feedback, order: 6 }
  components:
    - { id: app-page, componentKey: shared.app-page, regionId: header, purpose: 使用统一内容区边界 }
    - {
        id: search-panel,
        componentKey: shared.search-panel,
        regionId: search,
        purpose: 提供课程筛选与重置,
      }
    - {
        id: data-table,
        componentKey: shared.data-table,
        regionId: data,
        purpose: 展示服务端分页课程列表,
      }
    - { id: pagination, componentKey: shared.app-pagination, regionId: data, purpose: 使用统一分页 }
    - {
        id: detail-drawer,
        componentKey: shared.detail-drawer,
        regionId: detail,
        purpose: 展示课程、视频与审计详情,
      }
    - {
        id: form-drawer,
        componentKey: shared.form-drawer,
        regionId: form,
        purpose: 承载课程创建编辑与上传状态,
      }
    - {
        id: confirm-dialog,
        componentKey: shared.form-dialog,
        regionId: feedback,
        purpose: 确认复制与状态操作,
      }
states:
  - {
      id: ready,
      isDefault: true,
      scopeRef: page,
      observableResult: 展示筛选、课程宽表、详情、编辑与上传状态,
      ruleRef: training-prd,
    }
  - { id: loading, scopeRef: data, observableResult: 保留列表结构并显示加载状态, ruleRef: list-ux }
  - {
      id: empty,
      scopeRef: data,
      observableResult: 无课程或无匹配结果时显示稳定空状态,
      ruleRef: list-ux,
    }
  - {
      id: retryable-error,
      scopeRef: data,
      observableResult: 加载失败时保留筛选并提供重试,
      ruleRef: list-ux,
    }
interactions:
  - {
      id: query-courses,
      trigger: 填写课程条件并点击查询,
      targetRef: data,
      observableResult: 原型刷新 Fixture，正式页执行服务端查询且页码回到第一页,
      ruleRef: training-prd,
    }
  - {
      id: edit-course,
      trigger: 点击新建或编辑课程,
      targetRef: form,
      observableResult: 单片不超过200MB与10分钟；选择时检查大小并尽力读取原片时长，无法识别保留说明并以转换后服务端时长复核；上传及校验成功才可保存，自动展示标准化视频预览供保存前核对，编辑已有课程可播放当前视频,
      ruleRef: training-prd,
    }
  - {
      id: preview-course-video,
      trigger: 打开课程详情自动加载或点击重新加载视频,
      targetRef: detail,
      observableResult: 自动取链、显示有效临时缩略图但不自动播放；封面不可用仍可播放，续签保留进度；旧视频提示未标准化，没有画面明确提示，关闭移除媒体和封面并取消请求,
      ruleRef: course-video-api,
    }
  - {
      id: copy-course,
      trigger: 点击复制并确认生成副本,
      targetRef: feedback,
      observableResult: 明确生成草稿、未锁定且复用视频引用,
      ruleRef: training-prd,
    }
  - {
      id: change-course-status,
      trigger: 点击启用或停用,
      targetRef: feedback,
      observableResult: 展示作用范围并等待服务端确认语义,
      ruleRef: training-prd,
    }
mockScenarios:
  - {
      id: ready-default,
      isDefault: true,
      fixtureRef: src/features/training/content-exam/preview/trainingContent.fixture.ts,
      stateRef: ready,
      acceptanceRefs: [course-workflow, preview-isolated],
    }
  - {
      id: loading-state,
      fixtureRef: src/features/training/content-exam/preview/trainingContent.fixture.ts,
      stateRef: loading,
      acceptanceRefs: [course-workflow],
    }
  - {
      id: empty-state,
      fixtureRef: src/features/training/content-exam/preview/trainingContent.fixture.ts,
      stateRef: empty,
      acceptanceRefs: [course-workflow],
    }
  - {
      id: error-state,
      fixtureRef: src/features/training/content-exam/preview/trainingContent.fixture.ts,
      stateRef: retryable-error,
      acceptanceRefs: [course-workflow],
    }
exceptions: []
issues:
  blockers:
    - {
        id: resource-registration-pending,
        description: 后端菜单与 Function 资源由用户另行安排登记，本次只完成页面开发,
        affectedScopes: [production-regression],
        owner: IAM 资源初始化,
        resolutionTarget: 按接口说明登记并授权后进行真实联调,
      }
  deferred:
    - {
        id: training-type-dictionary,
        description: 培训类型字典尚未最终确定，Candidate 使用示例值表达,
        affectedScopes: [production-binding],
        owner: 产品与后端,
      }
  outOfScope:
    - {
        id: employee-learning-writes,
        description: 管理端视频预览不写入员工学习时长或完成记录；格式转码及真实存储部署由后端配合,
        affectedScopes: [production-binding],
      }
acceptance:
  - {
      id: permission-loading,
      sourceRef: iam-runtime-permission,
      observableResult: 权限未就绪或属于其他页时保持加载且不请求业务；路由提交后用最终条件只查询一次，真实拒绝及查询失败仍拦截或可重试，旧响应不覆盖新上下文,
      affectedScopes: [production-binding, production-regression],
      testRef: tests/visual/training-permission-loading.spec.ts,
    }
  - {
      id: editor-video-preview,
      sourceRef: training-prd,
      observableResult: 课程新建编辑统一上传后预览，转换校验完成前不预览新原片；成功自动取链展示缩略图和标准视频但不自动播放，失败可重试预览且不重复上传；关闭或更换文件释放旧媒体，保存仍只提交文件ID；超限不提交课程，无法预读时长不冒充预检通过,
      affectedScopes: [preview-interaction, production-binding, production-regression],
      testRef: tests/visual/training-content-production.spec.ts,
    }
  - {
      id: video-preview-lifecycle,
      sourceRef: course-video-api,
      observableResult: 只读用户打开详情自动看到缩略图或首帧且不出声；封面失败不阻断播放，按较早有效租约续签保留进度，无循环请求；旧视频不冒充已转码，关闭清理；无员工学习写请求，三视口及缩短高度不遮挡,
      affectedScopes: [preview-interaction, production-binding, production-regression],
      testRef: tests/visual/training-content-production.spec.ts,
    }
  - {
      id: compact-row-actions,
      sourceRef: list-ux,
      observableResult: 对象名称作为已有详情入口，不重复展示详情按钮；操作列按可见按钮自动测量，最多三列且紧凑行距,
      affectedScopes: [preview-visual, preview-interaction, production-regression],
      testRef: tests/visual/compact-row-actions.spec.ts,
    }
  - {
      id: production-api-binding,
      sourceRef: training-content-api,
      observableResult: 正式页面按接口执行查询详情写入并保留失败上下文,
      affectedScopes: [production-binding, production-regression],
      testRef: tests/visual/training-content-production.spec.ts,
    }
  - {
      id: course-workflow,
      sourceRef: training-prd,
      observableResult: 课程列表、详情、编辑、上传、锁定、复制和状态流转均可观察,
      affectedScopes: [preview-visual, preview-interaction],
      stateRef: ready,
      testRef: tests/visual/training-content-exam-previews.spec.ts,
    }
  - {
      id: preview-isolated,
      sourceRef: list-ux,
      observableResult: Candidate 仅使用静态 Fixture，不发起业务请求,
      affectedScopes: [preview-interaction],
      testRef: tests/visual/training-content-exam-previews.spec.ts,
    }
verification:
  viewports: [desktop-1366, desktop-1440, desktop-1920]
  browserTests:
    [
      tests/visual/training-content-exam-previews.spec.ts,
      tests/visual/training-content-production.spec.ts,
      tests/visual/training-permission-loading.spec.ts,
    ]
