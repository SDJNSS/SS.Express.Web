schemaVersion: '0.1'
page:
  id: iam-position-management
  name: 岗位管理
  feature: iam/foundation
  type: ListPage
  patternKey: ListPageTemplate
  revision: 4
sources:
  inputMode: prd-only
  prd:
    - {
        id: position-prd,
        ref: docs/prd/iam/organization-identity-tenant-foundation.md,
        section: M04 岗位管理,
        purpose: 定义岗位查询、创建、编辑和停启用,
      }
  api:
    - {
        id: position-api,
        ref: docs/api/iam-admin-api.md,
        section: 47-50 Position endpoints,
        operation: POST /iam-admin/Position/Query; Create; Update; ChangeStatus,
        purpose: 定义岗位分页与维护,
      }
  permissions:
    - {
        id: position-permission,
        ref: docs/prd/iam/organization-identity-tenant-foundation.md,
        section: M04 权限与安全要求,
        purpose: 岗位普通管理按对应 Function、当前 Tenant/实体资源范围和业务状态授权，服务端最终裁决,
      }
  ux:
    - {
        id: list-ux,
        ref: UX-CONTRACT.md,
        section: List and CRUD behavior,
        purpose: 约束列表、抽屉、状态确认与失败恢复,
      }
  references:
    - {
        id: project-design,
        ref: DESIGN.md,
        origin: project,
        kind: document,
        purpose: 复用平台 ListPage 视觉,
      }
implementation:
  canonicalEntry: src/features/iam/foundation/components/PositionManagementPageView.vue
  previewEntry: src/features/iam/foundation/public.preview.ts
  previewBinding: src/features/iam/foundation/preview/FoundationPreviewPage.vue
  productionBinding: src/features/iam/foundation/pages/PositionManagementPage.vue
  productionRoute: /iam/positions
  routeSource: src/features/iam/routes.ts
composition:
  layoutKey: AppLayout
  regions:
    - { id: header, role: header, order: 1 }
    - { id: search, role: search, order: 2 }
    - { id: data, role: data, order: 3 }
    - { id: detail, role: detail, order: 4 }
    - { id: form, role: form, order: 5 }
  components:
    - { id: app-page, componentKey: shared.app-page, regionId: header, purpose: 使用统一内容区边界 }
    - {
        id: search-panel,
        componentKey: shared.search-panel,
        regionId: search,
        purpose: 提供岗位筛选,
      }
    - { id: data-table, componentKey: shared.data-table, regionId: data, purpose: 展示岗位分页列表 }
    - { id: pagination, componentKey: shared.app-pagination, regionId: data, purpose: 展示统一分页 }
    - {
        id: detail-drawer,
        componentKey: shared.detail-drawer,
        regionId: detail,
        purpose: 展示岗位详情,
      }
    - {
        id: form-drawer,
        componentKey: shared.form-drawer,
        regionId: form,
        purpose: 承载岗位创建编辑,
      }
states:
  - {
      id: ready,
      isDefault: true,
      scopeRef: page,
      observableResult: 岗位筛选、列表、有效成员数和操作完整可见,
      ruleRef: position-prd,
    }
  - { id: loading, scopeRef: data, observableResult: 列表保留结构并显示加载状态, ruleRef: list-ux }
  - { id: empty, scopeRef: data, observableResult: 无岗位或无结果时显示空状态, ruleRef: list-ux }
  - {
      id: retryable-error,
      scopeRef: data,
      observableResult: 加载失败显示重试入口,
      ruleRef: list-ux,
    }
interactions:
  - {
      id: query-positions,
      trigger: 输入关键词或状态并点击查询,
      targetRef: data,
      observableResult: 本地 Fixture 过滤且页码重置,
      ruleRef: position-prd,
    }
  - {
      id: maintain-position,
      trigger: 点击新建或编辑,
      targetRef: form,
      observableResult: 创建不展示、采集或提交岗位编码，由服务端生成；编辑态编码仅只读展示,
      ruleRef: position-prd,
    }
  - {
      id: change-position-status,
      trigger: 点击停启用,
      targetRef: detail,
      observableResult: 有有效成员时明确阻断并说明先结束岗位归属,
      ruleRef: position-prd,
    }
mockScenarios:
  - {
      id: ready-default,
      isDefault: true,
      fixtureRef: src/features/iam/foundation/preview/foundation.fixture.ts,
      stateRef: ready,
      acceptanceRefs: [position-workflow, preview-isolated],
    }
  - {
      id: loading-state,
      fixtureRef: src/features/iam/foundation/preview/foundation.fixture.ts,
      stateRef: loading,
      acceptanceRefs: [position-workflow],
    }
  - {
      id: empty-state,
      fixtureRef: src/features/iam/foundation/preview/foundation.fixture.ts,
      stateRef: empty,
      acceptanceRefs: [position-workflow],
    }
  - {
      id: error-state,
      fixtureRef: src/features/iam/foundation/preview/foundation.fixture.ts,
      stateRef: retryable-error,
      acceptanceRefs: [position-workflow],
    }
exceptions: []
issues:
  blockers: []
  deferred: []
  outOfScope:
    - {
        id: no-role-permission,
        description: 岗位页面不展示或维护角色与权限,
        affectedScopes: [preview-visual, production-binding],
      }
acceptance:
  - {
      id: position-workflow,
      sourceRef: position-prd,
      observableResult: 岗位列表、详情、创建编辑和状态保护可观察；创建/更新请求不提交 position_code，且不暗示岗位授权,
      affectedScopes: [preview-visual, preview-interaction],
      stateRef: ready,
      testRef: tests/visual/iam-foundation-previews.spec.ts,
    }
  - {
      id: preview-isolated,
      sourceRef: list-ux,
      observableResult: Preview 使用静态 Fixture 且不发起业务请求,
      affectedScopes: [preview-interaction],
      testRef: tests/visual/iam-foundation-previews.spec.ts,
    }
  - {
      id: delegated-function-access,
      sourceRef: position-permission,
      observableResult: 非 Tenant 管理员在当前 Tenant 获得对应 Function 后可完成查询、详情、创建、编辑和状态操作；未获 Function 时入口不可用,
      affectedScopes: [production-binding],
      stateRef: ready,
      testRef: tests/visual/iam-organization-position-authorization.spec.ts,
    }
verification:
  viewports: [desktop-1366, desktop-1440, desktop-1920]
  browserTests:
    - tests/visual/iam-foundation-previews.spec.ts
    - tests/visual/iam-organization-position-authorization.spec.ts
